    <h1>Spike Editor Videos</h1>
    <div class="intro">
        <p>This page stores YouTube URLs in GitHub Pages and shows a thumbnail preview for each video.</p>
        <p>Update the <strong>videos</strong> list in this file to add or remove class videos.</p>
    </div>

    <div id="video-grid" class="video-grid"></div>

    <script>
        function toggleMobileMenu() {
            document.body.classList.toggle('mobile-menu-open');
        }

        function closeMobileMenu() {
            document.body.classList.remove('mobile-menu-open');
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeMobileMenu();
            }
        });

        function searchCurrentPage() {
            const query = prompt('Search this page:');
            if (!query) return;

            const found = window.find(query, false, false, true, false, false, false);
            if (!found) {
                alert(`No matches found for "${query}".`);
            }
        }

        const videos = [
            {
                title: "Spike Prime Intro",
                url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            },
            {
                title: "Spike Prime Intro",
                url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            },
            {
                title: "Spike Prime Intro",
                url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            },
            {
                title: "Spike Prime Intro",
                url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            },
            {
                title: "Spike Prime Intro",
                url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            },
            {
                title: "Spike Prime Intro",
                url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            },
            {
                title: "Spike Prime Intro",
                url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            },
            {
                title: "Line Follower Demo",
                url: "https://youtu.be/aqz-KE-bpKQ"
            }
        ];

        function getYouTubeId(url) {
            try {
                const parsed = new URL(url);
                if (parsed.hostname.includes("youtu.be")) {
                    return parsed.pathname.replace("/", "");
                }
                if (parsed.hostname.includes("youtube.com")) {
                    return parsed.searchParams.get("v");
                }
            } catch (error) {
                return null;
            }
            return null;
        }

        function renderVideos() {
            const grid = document.getElementById("video-grid");
            grid.innerHTML = "";

            videos.forEach((video) => {
                const videoId = getYouTubeId(video.url);
                if (!videoId) {
                    return;
                }

                const card = document.createElement("div");
                card.className = "video-card";

                const thumbLink = document.createElement("a");
                thumbLink.href = video.url;
                thumbLink.target = "_blank";
                thumbLink.rel = "noopener noreferrer";

                const thumb = document.createElement("img");
                thumb.className = "video-thumb";
                thumb.src = `https://img.youtube.com/vi/${videoId}/0.jpg`;
                thumb.alt = `${video.title} thumbnail`;

                thumbLink.appendChild(thumb);

                const body = document.createElement("div");
                body.className = "video-body";

                const title = document.createElement("p");
                title.className = "video-title";
                title.textContent = video.title;

                const link = document.createElement("a");
                link.className = "video-link";
                link.href = video.url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "Open on YouTube";

                body.appendChild(title);
                body.appendChild(link);

                card.appendChild(thumbLink);
                card.appendChild(body);

                grid.appendChild(card);
            });
        }

        renderVideos();
    </script>
</body>
