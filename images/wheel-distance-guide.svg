<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f7f9fc"/>
  <rect x="24" y="24" width="1152" height="472" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="3"/>
  <text x="600" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d">Wheel rotation and distance</text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#52637a">One complete wheel rotation moves the robot one circumference.</text>

  <circle cx="280" cy="270" r="126" fill="#e7eef7" stroke="#1a73e8" stroke-width="8"/>
  <line x1="280" y1="144" x2="280" y2="396" stroke="#8da3bd" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M 280 270 A 126 126 0 1 1 191 181" transform="translate(20,-33)" fill="none" stroke="#e85d04" stroke-width="10" stroke-linecap="round"/>
  <path d="M 184 185 L 191 162 L 209 180 Z" transform="translate(20,-33)" fill="#e85d04"/>
  <text x="280" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">360°</text>
  <text x="280" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#52637a">one rotation</text>
  <text x="280" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#e85d04">circumference</text>
  <text x="280" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#e85d04">= 17.5 cm</text>

  <line x1="462" y1="270" x2="548" y2="270" stroke="#8da3bd" stroke-width="4"/>
  <path d="M 548 270 L 530 260 L 530 280 Z" fill="#8da3bd"/>

  <rect x="570" y="148" width="540" height="244" rx="10" fill="#f0f6ff" stroke="#b8c9df" stroke-width="2"/>
  <text x="840" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d">Distance calculation</text>
  <text x="840" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1a73e8">360° ÷ 17.5 cm</text>
  <text x="840" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52637a">= degrees per centimeter</text>
  <text x="840" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">degrees = (360 / 17.5) × distance_cm</text>
  <text x="840" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#52637a">Round the result to a whole number for the move command.</text>

  <rect x="570" y="416" width="540" height="52" rx="8" fill="#172b4d"/>
  <text x="840" y="450" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#ffffff">move(port, degrees, steering, speed)</text>
</svg>
