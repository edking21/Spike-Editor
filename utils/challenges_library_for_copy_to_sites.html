    <script>
        // Utility functions (from utils.js)
function refreshSnippets(buttonId) {
    const column = document.getElementById('snippet-column');
    column.innerHTML = '';

    const data = snippetData[buttonId];
    if (!data) return;

    data.snippets.forEach((snippet, index) => {
        const snippetDiv = document.createElement('div');
        snippetDiv.className = 'snippet movement';

        const preId = `snippet-${buttonId}-${index}`;
        const pre = document.createElement('pre');
        pre.id = preId;
        pre.contentEditable = true;
        pre.style.display = 'none';

        // build the copy text: include function definition (if any), comment, then python body
        const parts = [];
        parts.push(snippet.textPython);
        pre.textContent = parts.join('\n') + '\n';

        //console.log(`BUILDING PRE HERE AS: ${pre.textContent}`);

        snippetDiv.appendChild(pre);

        const button = document.createElement('button');
        // emoji slightly larger via CSS class
        button.innerHTML = `<span class="emoji">${snippet.emoji}</span><span class="label">${snippet.buttonText}</span>`;
        button.style.backgroundColor = snippet.color;
        button.style.color = (buttonId === 4 || buttonId === 5 || buttonId === 6) ? '#000000' : '#ffffff';
        button.title = snippet.buttonText; // keep accessible label

        button.addEventListener('click', () => copySnippetWithLineInsert(preId));

        snippetDiv.appendChild(button);
        column.appendChild(snippetDiv);
    });
}

function copySnippetWithLineInsert(preId) {
    const el = document.getElementById(preId);
    if (!el) {
        console.warn(`copySnippetWithLineInsert: element with id ${preId} not found`);
        alert('Snippet not available to copy. Try clicking the left-column emoji to reload snippets.');
        return;
    }

    const text = el.textContent || '';

    // do not add additional indentation here; keep text as authored
    const textToCopy = text;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).catch(() => fallbackCopy(textToCopy));
    } else {
        fallbackCopy(textToCopy);
    }
}

function fallbackCopy(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'absolute';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    try { document.execCommand('copy'); } catch (e) { console.error('fallback copy failed', e); }
    document.body.removeChild(textarea);
}

async function fetchGitHubRelease() {
    /**
     * Fetches the latest release information from the GitHub repository and updates the UI.
     * 
     * This function makes an API call to the GitHub releases endpoint to retrieve the latest
     * release data for the Spike-Editor repository. It updates the release-info element with
     * the fetched release name or falls back to a default version if the request fails.
     * 
     * @async
     * @function fetchGitHubRelease
     * @returns {Promise<void>} A promise that resolves when the release information has been fetched and displayed
     * @throws {Error} Throws an error if the GitHub API request fails or returns a non-ok response
     * 
     * @example
     * // Call the function to update release information
     * await fetchGitHubRelease();
     * 
     * @description
     * - Makes a GET request to 'https://api.github.com/repos/edking21/Spike-Editor/releases/latest'
     * - On success: Updates the 'release-info' element with "© 2025 Spike Editor - Release {release.name}"
     * - On failure: Falls back to "© 2025 Spike Editor - Release v1.0.0" and logs a warning
     * - Requires an HTML element with id 'release-info' to exist in the DOM
     */
    try {
        const response = await fetch('https://api.github.com/repos/edking21/Spike-Editor/releases/latest');
        if (response.ok) {
            const release = await response.json();
            const releaseInfo = document.getElementById('release-info');
            const releaseLabel = (release.name && release.name.trim()) ? release.name : release.tag_name;
            releaseInfo.textContent = `© Spike Editor - Release ${releaseLabel}`;
        } else {
            throw new Error('Failed to fetch release');
        }
    } catch (error) {
        console.warn('Could not fetch GitHub release:', error);
        const releaseInfo = document.getElementById('release-info');
        releaseInfo.textContent = '© Spike Editor - Release v1.0.0';
    }
}

        getTextColorForBackground(backgroundColor) {
            if (typeof backgroundColor !== 'string') return '#ffffff';

            const value = backgroundColor.trim();
            const hexMatch = value.match(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
            if (!hexMatch) return '#ffffff';

            let hex = hexMatch[1];
            if (hex.length === 3) {
                hex = hex.split('').map((c) => c + c).join('');
            }

            // Keep Control category text white for readability on dark yellow.
            if (hex.toLowerCase() === 'daa520') return '#ffffff';

            const r = parseInt(hex.slice(0, 2), 16);
            const g = parseInt(hex.slice(2, 4), 16);
            const b = parseInt(hex.slice(4, 6), 16);
            const luminance = ((0.299 * r) + (0.587 * g) + (0.114 * b)) / 255;

            return luminance > 0.6 ? '#000000' : '#ffffff';
        },
        applySnippetTextColor(snippets) {
            return (snippets || []).map((snippet) => ({
                ...snippet,
                textColor: snippet?.textColor || this.getTextColorForBackground(snippet?.color)
            }));
        }
    };

            function resolveSection(snippet) {
                const explicit = normalize(snippet?.section || snippet?.sectionLabel || snippet?.groupLabel);

                const text = normalize(snippet?.buttonText);

                    const rule = sectionRules.find(r =>
                        normalize(r.label) === explicit || r.key === explicit.replace(/\s+/g, '')
                    );
                    if (rule) return rule;

                // id prefix rules

########################################################################
# ☀️ is the distance sensor seeing something close

    """

        if..                    if is_near():

import color, color_sensor, distance_sensor, force_sensor

from runloop import run, until
from time import sleep, sleep_ms

# Constants
CM_TO_DEGREES = 21
INCHES_TO_DEGREES = 53

distance_port = port.B
color_port = port.F

# ☀️ is the distance sensor seeing something close
########################################################################

    """
    Examples:
        if..                    if is_near():

        repeat until lambda.    while not (lambda: is_near(150)): # use lambda to override 100
        wait until..            await until (is_near()):
        wait until lambda...    await until (lambda: is_near(150)): # use lambda to override 100
    """

########################################################################
# 🛑 is the color sensor seeing blue
########################################################################

    """
    Examples:
        if                  if is_blue():
        wait until          await until(is_blue):
        repeat until        while not (is_blue()):
    """

########################################################################

        velocity = 100      # degrees per second

        # Go shortest path to position -40 degrees then back to 0
        await motor.run_to_absolute_position(arm_motor, 0, velocity, direction=motor.SHORTEST_PATH)
        await motor.run_to_absolute_position(arm_motor, -40, velocity, direction=motor.SHORTEST_PATH)
        sleep_ms(200)
        await motor.run_to_absolute_position(arm_motor, 0, velocity, direction=motor.SHORTEST_PATH)

async def when_left_button_pressed():

    sleep_milliseconds = 40    # sleep for 40 milliseconds between each check of the color sensor

            sleep_ms(2000)     # sleep 2000 milliseconds (2 seconds)

            motor_pair.move(motor_pair.PAIR_1, -steering, velocity=speed)

        )

        function resolveFigureSource(figure) {
            return figure?.imagePath || '';
        }

        function hideFigureView() {
            const modal = document.getElementById('figure-modal-backdrop');
            const image = document.getElementById('figure-image');
            if (modal) modal.style.display = 'none';
            if (image) image.removeAttribute('src');
        }

        function showFigure(year, figure) {
            const image = document.getElementById('figure-image');
            const caption = document.getElementById('figure-caption');
            const url = resolveFigureSource(figure);
            if (!image || !caption || !url) return;
            image.onload = () => {
                image.style.display = 'block';
                caption.textContent = `${year} - ${figure.label}`;
            };
            image.onerror = () => {
                image.style.display = 'none';
                caption.textContent = `${year} ${figure.label}: unable to load this image.`;
            };
            image.src = url;
            image.alt = `${year} ${figure.label}`;
        }

        function renderFigureButtons() {
            const year = document.getElementById('figure-year')?.value || '2026-2027';
            const host = document.getElementById('figure-button-list');
            if (!host) return;
            host.textContent = '';
            (figureLibrary[year] || []).forEach(figure => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'figure-button';
                button.textContent = `Challenge ${figure.number}`;
                button.addEventListener('click', () => showFigure(year, figure));
                host.appendChild(button);
            });
        }

        function openFigureViewer() {
            const modal = document.getElementById('figure-modal-backdrop');
            if (!modal) return;
            if (!modal.dataset.initialized) {
                document.getElementById('figure-year')?.addEventListener('change', renderFigureButtons);
                document.getElementById('figure-close')?.addEventListener('click', hideFigureView);
                modal.addEventListener('click', event => {
                    if (event.target === modal) hideFigureView();
                });
                modal.dataset.initialized = 'true';
            }
            renderFigureButtons();
            modal.style.display = 'flex';
        }

        window.openFigureViewer = openFigureViewer;

            const group = snippetData[groupId];
            renderers.renderSnippetButtons({
                containerId: 'snippet-column',
                snippets: (typeof colorUtils.applySnippetTextColor === 'function')
                    ? colorUtils.applySnippetTextColor(group?.snippets || [])
                    : (group?.snippets || [])
            });
        }

                const source = snippetData[id]?.snippets || [];
                return (typeof colorUtils.applySnippetTextColor === 'function')
                    ? colorUtils.applySnippetTextColor(source)
                    : source;
            });
            renderers.renderSnippetButtons({
                containerId: 'snippet-column',
                snippets: combined
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderers.renderEmojiButtons({
                containerId: 'emoji-block',
                buttons: (typeof colorUtils.getEmojiButtons === 'function')
                    ? colorUtils.getEmojiButtons(classEmojiGroupOrder)
                    : [],
                onClickFnName: 'refreshSnippets'
            });
            renderAllSnippetGroups();
        });
    </script>
</body>
</html>
