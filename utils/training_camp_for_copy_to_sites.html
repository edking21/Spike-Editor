<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spike</title>
    <style>
body {
    font-family: Arial, sans-serif;
    padding: 0px 2px 2px 2px;
    background-color: #ffffff;
    color: #000000;
    margin: 0;
}

.top-menu {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    background-color: #1a73e8;
    border-bottom: 1px solid #1a73e8;
    box-sizing: border-box;
    z-index: 1000;
    font-family: Arial, sans-serif;
    justify-content: flex-start;
    gap: 0;
}

.menu-search {
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 18px;
    line-height: 48px;
    height: 48px;
    width: 28px;
    cursor: pointer;
    padding: 0;
    margin-left: 14px;
    margin-right: 0;
}

.menu-toggle {
    display: none;
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 24px;
    line-height: 48px;
    height: 48px;
    width: 32px;
    cursor: pointer;
    padding: 0;
    margin-right: 10px;
}

.menu-brand {
    font-size: 16px;
    font-weight: 400;
    color: #ffffff;
    white-space: nowrap;
    line-height: 48px;
}

.menu-links {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 22px;
    height: 48px;
}

.menu-dropdown {
    position: relative;
    height: 48px;
    display: flex;
    align-items: center;
}

.menu-dropdown-toggle {
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
    height: 48px;
    line-height: 48px;
    padding: 0;
    cursor: pointer;
    border-bottom: 2px solid #ffffff;
    box-sizing: border-box;
}

.menu-dropdown-menu {
    display: none;
    position: absolute;
    top: 48px;
    left: 0;
    min-width: 300px;
    background: #ffffff;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    z-index: 1300;
    padding: 2px 0;
}

.menu-dropdown.open .menu-dropdown-menu {
    display: block;
}

.menu-dropdown-menu a,
.menu-dropdown-menu button,
.menu-dropdown-menu .dropdown-item {
    color: #222 !important;
    display: block;
    width: 100%;
    height: auto;
    line-height: 1.25;
    padding: 7px 10px;
    border: none;
    border-bottom: none;
    background: transparent;
    font-size: 13px;
    text-decoration: none;
    text-align: left;
    cursor: pointer;
    box-sizing: border-box;
}

.top-menu .menu-dropdown-menu a,
.top-menu .menu-dropdown-menu button,
.top-menu .menu-dropdown-menu .dropdown-item {
    height: auto;
    line-height: 1.25;
    border-bottom: none;
}

.menu-dropdown-menu a:hover,
.menu-dropdown-menu button:hover,
.menu-dropdown-menu .dropdown-item:hover {
    background: #f5f7fb;
}

.mobile-sidebar {
    display: none;
}

.mobile-overlay {
    display: none;
}

.top-menu a {
    color: #ffffff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    display: block;
    height: 48px;
    line-height: 48px;
    border-bottom: 2px solid transparent;
    box-sizing: border-box;
}

.top-menu a:visited {
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
}

.top-menu a:hover {
    color: #ffffff;
}

.top-menu a.active {
    color: #ffffff;
    border-bottom-color: #ffffff;
    font-size: 13px;
    font-weight: 500;
}

.top-menu a.active:visited {
    color: #ffffff;
}

.left-column {
    position: fixed;
    top: 0px;
    left: 0;
    z-index: 901;
    width: 80px;
    height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    background-color: #f5f5f5;
    border-right: 1px solid #ccc;
    box-sizing: border-box;
}

.emoji-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding-top: 12px;
    height: 100%;
    overflow-y: auto;
    width: 100%;
}

.lesson-launcher {
    display: none;
}

.training-camp-snippet-column .lesson-launcher {
    --launcher-left: calc(80px + 12px);
    position: fixed;
    left: var(--launcher-left);
    right: 12px;
    bottom: max(0px, env(safe-area-inset-bottom));
    max-width: 460px;
    min-height: 38px;
    height: clamp(38px, 7vh, 56px);
    border: none;
    border-radius: 0;
    background: #f5f7fb;
    color: #222;
    padding: 0 12px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    cursor: pointer;
    box-shadow: none;
    border-top: 1px solid #dbe1ea;
    transition: background-color 0.14s ease;
    z-index: 1002;
}

.training-camp-snippet-column .lesson-launcher:hover {
    background: #edf2fb;
}

.lesson-launcher-menu {
    display: none;
    position: fixed;
    top: auto;
    left: calc(80px + 12px);
    right: 12px;
    bottom: calc(max(0px, env(safe-area-inset-bottom)) + clamp(38px, 7vh, 56px) + 2px);
    min-width: 260px;
    max-width: 420px;
    padding: 2px 0;
    height: 111px;
    overflow: hidden;
    z-index: 1301;
}

.lesson-launcher-menu.open {
    display: block;
}

@media (max-width: 900px) {
    .training-camp-snippet-column .lesson-launcher {
        --launcher-left: 12px;
        right: 12px;
    }

    .lesson-launcher-menu {
        left: 12px;
        right: 12px;
        min-width: 0;
        max-width: none;
    }
}

@media (max-height: 520px) {
    .training-camp-snippet-column .lesson-launcher {
        min-height: 34px;
        height: 34px;
        padding: 0 10px;
    }

    .lesson-launcher-menu {
        bottom: calc(max(0px, env(safe-area-inset-bottom)) + 36px + 2px);
    }
}

.lesson-launcher-icon {
    display: inline-block;
    min-width: 16px;
    text-align: center;
    font-size: 14px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: 0;
    white-space: nowrap;
    font-family: "Segoe UI Symbol", "Arial Unicode MS", Arial, sans-serif;
}

.lesson-launcher-text {
    font-size: 13px;
    line-height: 1.2;
    font-weight: 500;
    letter-spacing: 0.02em;
}

#snippet-content {
    padding-bottom: clamp(46px, 9vh, 72px);
}

.emoji-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.emoji-container button {
    font-size: 32px;
    cursor: pointer;
    border: none;
    background: none;
    transition: transform 0.15s ease, filter 0.15s ease;
}

.emoji-container button:hover {
    transform: scale(1.08);
    filter: brightness(110%);
}

.emoji-label {
    margin-top: 1px;
    font-size: 12px;
    color: black;
    text-align: center;
    width: 70px;
    word-wrap: break-word;
}

.snippet-column {
    margin-left: 80px;
    padding: 0px 12px 12px 12px;
}

.sensor-quiz-frame {
    position: fixed;
    top: 48px;
    right: 0;
    bottom: 0;
    left: 80px;
    z-index: 900;
    width: calc(100vw - 80px);
    height: calc(100vh - 48px);
    border: 0;
    background: #e8e8e8;
}

.sensor-quiz-close {
    position: fixed;
    top: 56px;
    right: 12px;
    z-index: 1001;
    min-height: 36px;
    padding: 6px 12px;
    border: 1px solid #b8b8b8;
    border-radius: 4px;
    background: #fff;
    color: #222;
    font: inherit;
    cursor: pointer;
}

.sensor-quiz-close:hover {
    background: #f3f3f3;
}

.snippet {
    border: none;
    border-radius: 8px;
    padding: 6px;
    margin: 8px 0;
    background-color: transparent;
    width: 100%;
    box-sizing: border-box;
}

.snippet button {
    cursor: pointer;
    padding: 8px 12px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.12s ease, filter 0.12s ease;
}

.snippet button:hover {
    transform: scale(1.04);
    filter: brightness(110%);
}

.snippet .emoji {
    font-size: 1.3em;
    line-height: 1;
}

.snippet .label {
    font-size: 1em;
    white-space: pre-line;
}

.snippet-group-label {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #555;
    padding: 8px 8px 4px 8px;
    margin-top: 8px;
    border-top: 1px solid #e6e6e6;
    user-select: none;
}

.snippet-group-label:first-child {
    margin-top: 0;
    border-top: none;
}

.figure-modal-backdrop {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(15, 23, 42, 0.38);
    backdrop-filter: blur(2px);
    z-index: 2000;
}

.figure-panel {
    position: relative;
    width: min(680px, calc(100vw - 32px));
    max-width: 680px;
    background: #f7f9fc;
    border: 1px solid #dbe3ee;
    border-radius: 14px;
    box-sizing: border-box;
    padding: 20px 20px 18px 20px;
    box-shadow: 0 18px 42px rgba(15, 23, 42, 0.22);
}

.figure-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding-right: 36px;
}

.figure-header h2 {
    margin: 0;
    font-size: 20px;
    color: #1f2937;
}

.figure-year-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #1f2937;
}

.figure-year-picker select {
    border: 1px solid #cfd8e3;
    border-radius: 8px;
    background: #ffffff;
    color: #1f2937;
    font-size: 13px;
    padding: 8px 10px;
    min-width: 140px;
}

.figure-close {
    position: absolute;
    top: 12px;
    right: 12px;
    border: 1px solid #d6dce5;
    background: #ffffff;
    color: #374151;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
}

.figure-close:hover {
    background: #f3f4f6;
}

.figure-button-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
}

.figure-button {
    background: #1a73e8;
    color: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.figure-button:hover:not(:disabled) {
    opacity: 0.92;
    transform: translateY(-1px);
}

.figure-button:disabled {
    background: #b7c2d1;
    color: #eef3f8;
    cursor: not-allowed;
}

.figure-display-card {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    background: #ffffff;
    border: 1px solid #dfe7f3;
    border-radius: 10px;
    padding: 16px;
}

.figure-image-wrap {
    width: min(100%, 420px);
    min-height: 220px;
    background: linear-gradient(135deg, #f3f7ff, #edf5ff);
    border: 1px solid #d6e0f0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.figure-image-wrap img {
    display: none;
    max-width: 100%;
    max-height: 420px;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 8px;
}

.figure-meta {
    display: block;
    flex: 1;
    min-width: 0;
}

@media (max-width: 650px) {
    .figure-meta {
        display: none;
    }
}

.figure-caption {
    font-size: 16px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 8px;
}

.figure-note {
    font-size: 12px;
    color: #4b5563;
    line-height: 1.5;
}

.release-info {
    text-align: center;
    margin-top: 400px;
    padding: 20px;
    font-size: 12px;
    color: #666;
    border-top: 1px solid #eee;
}

.emoji-container .color-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
    font-size: 0;
}

.emoji-container .color-circle:hover {
    transform: scale(1.08);
    filter: brightness(110%);
}

.emoji-container .light-blue-circle   { background-color: #92b1e0 !important; }
.emoji-container .blue-circle         { background-color: #0066FF !important; }
.emoji-container .light-blue-circle   { background-color: #87CEEB !important; }
.emoji-container .red-circle          { background-color: #CC0000 !important; }
.emoji-container .pink-circle         { background-color: #FF69B4 !important; }
.emoji-container .purple-circle       { background-color: #8A2BE2 !important; }
.emoji-container .yellow-circle       { background-color: #FFD700 !important; }
.emoji-container .dark-yellow-circle  { background-color: #DAA520 !important; }
.emoji-container .green-circle        { background-color: #32CD32 !important; }
.emoji-container .orange-circle       { background-color: #FF8C00 !important; }
.emoji-container .light-orange-circle { background-color: #F7B267 !important; }
.emoji-container .dark-orange-circle  { background-color: #FF6600 !important; }
.emoji-container .light-purple-circle { background-color: #a564e1 !important; }

@media (max-width: 500px) {
    .sensor-quiz-frame {
        left: 0;
        width: 100vw;
    }

    .menu-toggle {
        display: block;
    }

    .menu-links {
        display: none;
    }

    .menu-search {
        margin-left: auto;
    }

    .mobile-sidebar {
        display: block;
        position: fixed;
        top: 48px;
        left: 0;
        width: 230px;
        height: calc(100vh - 48px);
        background-color: #1a73e8;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        z-index: 1200;
        padding-top: 8px;
    }

    .mobile-sidebar a {
        display: block;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        padding: 12px 16px;
    }

    .mobile-sidebar a.active {
        background-color: rgba(255, 255, 255, 0.18);
    }

    .mobile-overlay {
        display: block;
        position: fixed;
        top: 48px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.35);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease;
        z-index: 1100;
    }

    body.mobile-menu-open .mobile-sidebar {
        transform: translateX(0);
    }

    body.mobile-menu-open .mobile-overlay {
        opacity: 1;
        visibility: visible;
    }

}
    </style>
</head>
<body>
    
    <div class="left-column">
        <div class="emoji-block" id="emoji-block">

        </div>
    </div>
    <div class="snippet-column">
        <div class="release-info" id="release-info">

        </div>
    </div>
<script>
        // Shared script (from scripts/spike-shared.js)
(function (global) {

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function copyTextToClipboard(text) {
        const content = String(text ?? '');
        return Promise.resolve(fallbackCopyTextToClipboard(content));
    }

    function fallbackCopyTextToClipboard(text) {
        const field = document.createElement('textarea');
        field.value = String(text ?? '');
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.opacity = '0';
        field.style.pointerEvents = 'none';
        document.body.appendChild(field);

        field.focus();
        field.select();
        field.setSelectionRange(0, field.value.length);

        let succeeded = false;
        try {
            succeeded = document.execCommand('copy');
        } catch {
            succeeded = false;
        }

        field.remove();
        return succeeded;
    }

            const base = this.emojiByGroupId[groupId] || {};
            return {

        getEmojiButtons(groupIds, overridesById = {}) {
            return (groupIds || []).map((id) => this.getEmojiButton(id, overridesById[id] || {}));
        },
        getTextColorForBackground(backgroundColor) {
            if (typeof backgroundColor !== 'string') return '#ffffff';

            const value = backgroundColor.trim();
            const hexMatch = value.match(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
            if (!hexMatch) return '#ffffff';

            let hex = hexMatch[1];
            if (hex.length === 3) {
                hex = hex.split('').map((c) => c + c).join('');
            }

            // Keep Control category text white for readability on dark yellow.
            if (hex.toLowerCase() === 'daa520') return '#ffffff';

            const r = parseInt(hex.slice(0, 2), 16);
            const g = parseInt(hex.slice(2, 4), 16);
            const b = parseInt(hex.slice(4, 6), 16);
            const luminance = ((0.299 * r) + (0.587 * g) + (0.114 * b)) / 255;

            return luminance > 0.6 ? '#000000' : '#ffffff';
        },
        applySnippetTextColor(snippets) {
            return (snippets || []).map((snippet) => ({
                ...snippet,
                textColor: snippet?.textColor || this.getTextColorForBackground(snippet?.color)
            }));
        }
    };

        renderSnippetButtons({ containerId, snippets }) {
            const host = document.getElementById(containerId);
            if (!host) return;

            const shown = new Set();

            const normalize = (v) =>
                String(v || '')
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, ' ')
                    .trim();

            const sectionRules = [
                { key: 'motors', label: 'Motors', match: ['motor', 'motors'] },
                { key: 'movement', label: 'Movement', match: ['move', 'movement'] },
                { key: 'light', label: 'Light', match: ['light'] },
                { key: 'sound', label: 'Sound', match: ['sound', 'beep', 'audio'] },
                { key: 'events', label: 'Events', match: ['ev', 'event', 'events', 'when'] },
                { key: 'control', label: 'Control', match: ['ctrl', 'control', 'repeat', 'forever'] },
                { key: 'sensors', label: 'Sensors', match: ['sensor', 'fn', 'distance', 'color'] },
                { key: 'operators', label: 'Operators', match: ['op', 'operator', 'operators'] },
                { key: 'variables', label: 'Variables', match: ['var', 'variable', 'variables'] },
                { key: 'moremotors', label: 'More Motors', match: ['more motors', 'moremotors'] },
                { key: 'moremovement', label: 'More Movement', match: ['more movement', 'moremovement'] },
                { key: 'gettingstarted', label: 'Getting Started', match: ['get', 'gettingstarted'] },
                { key: 'hay', label: 'Hay Bale', match: ['hay', 'hay bale'] },
                { key: 'round', label: 'Round the Garage', match: ['round', 'round the'] },
                { key: 'robot', label: 'Robot Shuffle', match: ['robot', 'robot shuffle'] },
                { key: 'figure', label: 'Figures', match: ['figure', 'figures'] }
            ];

            function resolveSection(snippet) {
                const explicit = normalize(snippet?.section || snippet?.sectionLabel || snippet?.groupLabel);
                const id = normalize(snippet?.id);
                const idCompact = id.replace(/\s+/g, '');
                const text = normalize(snippet?.buttonText);

                // explicit section first
                if (explicit) {
                    const rule = sectionRules.find(r =>
                        normalize(r.label) === explicit || r.key === explicit.replace(/\s+/g, '')
                    );
                    if (rule) return rule;
                }

                // id prefix rules
                if (id.startsWith('motor')) return sectionRules.find(r => r.key === 'motors');
                if (id.startsWith('move')) return sectionRules.find(r => r.key === 'movement');
                if (id.startsWith('light')) return sectionRules.find(r => r.key === 'light');
                if (id.startsWith('sound')) return sectionRules.find(r => r.key === 'sound');
                if (id.startsWith('ev')) return sectionRules.find(r => r.key === 'events');
                if (id.startsWith('ctrl') || id.startsWith('control')) return sectionRules.find(r => r.key === 'control');
                if (id === 'challenge9y') return sectionRules.find(r => r.key === 'sensors');
                if (id.startsWith('sensor') || id.startsWith('fn')) return sectionRules.find(r => r.key === 'sensors');
                if (id.startsWith('figure')) return sectionRules.find(r => r.key === 'figures');
                if (id.startsWith('op')) return sectionRules.find(r => r.key === 'operators');
                if (id.startsWith('var')) return sectionRules.find(r => r.key === 'variables');
                if (idCompact.startsWith('moremotors')) return sectionRules.find(r => r.key === 'moremotors');
                if (idCompact.startsWith('moremovement')) return sectionRules.find(r => r.key === 'moremovement');
                if (idCompact.startsWith('morehaybale')) return sectionRules.find(r => r.key === 'morehaybale');
                if (idCompact.startsWith('moresensors')) return sectionRules.find(r => r.key === 'moresensors');
                if (idCompact.startsWith('gettingstarted')) return sectionRules.find(r => r.key === 'gettingstarted');

                // fallback text match
                return sectionRules.find(rule =>
                    rule.match.some(token =>
                        text.startsWith(token) || text.includes(` ${token}`) || id.includes(token)
                    )
                );
            }

            host.textContent = '';

            (snippets || []).forEach((snippet) => {
                const section = resolveSection(snippet);

async def main():

########################################################################
# ☀️ initilize modules
########################################################################
import sys, motor_pair, motor, runloop, time
import color, color_sensor, distance_sensor, force_sensor
from hub import port, motion_sensor,button, light_matrix
from runloop import run, until
from time import sleep, sleep_ms

# Ports
motor_pair.pair(motor_pair.PAIR_1, port.C, port.D)
force_port = port.A
distance_port = port.B
color_port = port.F
arm_motor_port = port.E

# Constants

INCHES_TO_DEGREES = int(360/6.89)   # degrees_wheel_diameter:360 inches_wheel_circumference:6.89


########################################################################
# 🤖 wink one eye
########################################################################
def wink_one_eye(num_winks):
    if not isinstance(num_winks, (int, float)):
        raise ValueError("num_winks must be a number")
    if num_winks <= 0:
        raise ValueError("num_winks must be greater than 0")

    two_eyes_open = [
        0, 0, 0, 0, 0,
        0, 100, 0, 100, 0,
        0,0, 0,0, 0,
        100, 0, 0, 0, 100,
        0, 100, 100, 100, 0
    ]

    one_eye_open = [
        0, 0, 0, 0, 0,
        0, 100, 0, 0, 0,
        0,0, 0,0, 0,
        100, 0, 0, 0, 100,
        0, 100, 100, 100, 0
    ]
    
    for _ in range(int(num_winks)):
        light_matrix.show(two_eyes_open)
        sleep_ms(2000)
        light_matrix.show(one_eye_open)
        sleep_ms(200)




########################################################################
# 🤖 turn_90
########################################################################
async def turn_90(direction):
    if direction not in ("left", "right"):
        raise ValueError("direction must be 'left' or 'right'")

    motion_sensor.reset_yaw(0)
    sleep_ms(100)

    if direction == "left":
        steering = -100
        target_reached = lambda: motion_sensor.tilt_angles()[0] >= 873
    else:  # direction == "right"
        steering = 100
        target_reached = lambda: motion_sensor.tilt_angles()[0] <= -873

    motor_pair.move(
        motor_pair.PAIR_1,
        steering,
        velocity=150
    )

    await until(target_reached)

    motor_pair.stop(motor_pair.PAIR_1, stop=motor.BRAKE)
    sleep_ms(500)


########################################################################
# ☀️ is the distance sensor seeing something close
########################################################################
def is_near(distance_threshold=200):  # 200mm (7.874 inches)
    """
    Teacher tip:
        wait until the object is near
            await runloop.until(is_near) # pass the function itself

        repeat until the object is near
            while not is_near(): # call the function to get True/False

        override the distance
            await runloop.until(lambda: is_near(100))
            while not is_near(100)

    Why:
        - wait until needs a function
        - repeat until needs a True/False result
    """
    if not isinstance(distance_threshold, (int, float)):
        raise ValueError("distance_threshold must be a number")
    if distance_threshold <= 0:
        raise ValueError("distance_threshold must be greater than 0")

    distance = distance_sensor.distance(distance_port)
    if distance == -1:
        print("Warning : distance sensor returned -1")
        return False
    print("Distance {:5.2f} cm {:6.2f} inches ".format(distance / 10, distance /25.4))
    return distance < distance_threshold


########################################################################
# 🛑 is the color sensor seeing blue
########################################################################
def is_blue():
    """
    Teacher tip:
        wait until the color is blue
            await runloop.until(is_blue) # pass the function itself

        repeat until the color is blue
            while not is_blue(): # call the function to get True/False

    Why:
        - wait until needs a function
        - repeat until needs a True/False result
    """
    return color_sensor.color(color_port) == color.BLUE

########################################################################
# 🛑 is the force sensor pressed
########################################################################
def is_pressed():
    """
    Teacher tip:
        wait until the force sensor is pressed
            await runloop.until(is_pressed) # pass the function itself

        repeat until the force sensor is pressed
            while not is_pressed(): # call the function to get True/False

    Why:
        - wait until needs a function
        - repeat until needs a True/False result
    """
    return force_sensor.pressed(force_port)

async def when_left_button_pressed_lower_and_raise_the_arm():
    await until(lambda: bool(button.pressed(button.LEFT)) != 0)
    sleep_ms(1000)

    # Go shortest path to position -50 degrees then back to 0
    await motor.run_to_absolute_position(arm_motor_port, 0, 100, direction=motor.SHORTEST_PATH)
    await motor.run_to_absolute_position(arm_motor_port, -50, 100, direction=motor.SHORTEST_PATH)
    sleep_ms(200)

    await motor.run_to_absolute_position(arm_motor_port, 0, 100, direction=motor.SHORTEST_PATH)


########################################################################
# 🤖 when_right_button_pressed_detect_blue_line
########################################################################
async def when_right_button_pressed_detect_blue_line():
    await until(lambda: bool(button.pressed(button.RIGHT)) != 0)
    sleep_ms(1000)

    # start moving forward
    motor_pair.move(motor_pair.PAIR_1, 0, velocity=int(0.2 * 1100))

    await motor_pair.move_for_degrees(motor_pair.PAIR_1, -10 * CM_TO_DEGREES, 0)
    sleep_ms(200)

async def line_follower_bang_bang():

    steering = 50              # set steering to 50 for line following 
    speed    = int(0.2 * 1100) # set speed to 20% of max speed
    sleep_milliseconds = 40    # sleep for 40 milliseconds between each check of the color sensor

            sleep_ms(sleep_milliseconds)

        else:                  # if off the line turn left
            motor_pair.move(motor_pair.PAIR_1, steering, velocity=speed)
            sleep_ms(sleep_milliseconds)
        
    motor_pair.stop(motor_pair.PAIR_1)

    <script>
        const shared = window.SpikeShared || {};
        const { renderers = {}, snippetData = {}, colorUtils = {} } =
            (typeof shared.bootstrapPage === 'function'
                ? shared.bootstrapPage({
                    dropdownId: 'training-camp-dropdown',
                    toggleDropdownFnName: 'toggleTrainingCampDropdown',
                    closeDropdownFnName: 'closeTrainingCampDropdown'
                })
                : shared);

        if ((typeof shared.bootstrapPage !== 'function') && (!shared.renderers || !shared.snippetData)) {
            console.error('SpikeShared not loaded correctly. Check ./scripts/spike-shared.js export.');
        }

        const baseToggleTrainingCampDropdown = window.toggleTrainingCampDropdown;
        const baseCloseTrainingCampDropdown = window.closeTrainingCampDropdown;

        function closeTrainingCampDropdown() {
            if (typeof baseCloseTrainingCampDropdown === 'function') {
                baseCloseTrainingCampDropdown();
            }
        }

        function closeLessonLauncherMenu() {
            const lessonMenu = document.getElementById('lesson-launcher-menu');
            const lessonButton = document.querySelector('.lesson-launcher');
            if (lessonMenu) lessonMenu.classList.remove('open');
            if (lessonButton) lessonButton.setAttribute('aria-expanded', 'false');
        }

        function toggleTrainingCampDropdown(event) {
            closeLessonLauncherMenu();
            if (typeof baseToggleTrainingCampDropdown === 'function') {
                baseToggleTrainingCampDropdown(event);
            }
        }

        function toggleLessonLauncherMenu(event) {
            if (event) event.stopPropagation();

            const lessonMenu = document.getElementById('lesson-launcher-menu');
            const lessonButton = document.querySelector('.lesson-launcher');
            if (!lessonMenu) return;

            const shouldOpen = !lessonMenu.classList.contains('open');
            closeTrainingCampDropdown();
            closeLessonLauncherMenu();

            if (shouldOpen) {
                lessonMenu.classList.add('open');
                if (lessonButton) lessonButton.setAttribute('aria-expanded', 'true');
            }
        }

        window.toggleTrainingCampDropdown = toggleTrainingCampDropdown;
        window.closeTrainingCampDropdown = closeTrainingCampDropdown;
        window.toggleLessonLauncherMenu = toggleLessonLauncherMenu;

        const CAMP1_COMBINED_ID = 1001;
        const CAMP2_COMBINED_ID = 2001;
        const CAMP3_COMBINED_ID = 3001;
        const CAMP4_COMBINED_ID = 4001;

        const trainingCampOptions = [
            { key: 'camp1', label: 'Training Camp Robot Shuffle' },
            { key: 'camp2', label: 'Training Camp Round the Garage' },
            { key: 'camp3', label: 'Training Camp Hay Bale' },
            { key: 'camp4', label: 'Training Camp Sensors' }
        ];

        const trainingCampSnippetSelections = {
            camp1: {
                combined: {
                    [CAMP1_COMBINED_ID]: {
                        colorClass: 'movement-color',
                        groups: [ 2 ],
                        snippetIdsByGroup: {  }
                    }
                },
                groups: {
                    12: ['gettingstarted1']
                }
            },
            camp2: {
                combined: {
                    [CAMP2_COMBINED_ID]: {
                        colorClass: 'movement-color',
                        groups: [2 ],
                        snippetIdsByGroup: {
                            12: ['gettingstarted2'],
                        }
                    }
                },
                groups: {
                    12: ['gettingstarted2']
                }
            },
            camp3: {
                combined: {
                    [CAMP3_COMBINED_ID]: {
                        colorClass: 'movement-color',
                        groups: [1],
                        snippetIdsByGroup: {
                            12: ['gettingstarted3'],
                        }
                    }
                },
                groups: {
                        12: ['gettingstarted3']
                }
            },
            camp4: {
                combined: {
                    [CAMP4_COMBINED_ID]: {
                        colorClass: 'movement-color',
                        groups: [2, 3, 6, 7, 33, 12],
                        snippetIdsByGroup: {
                            // 2: ['move1', 'move2', 'move3', 'move6'],
                            // 3: ['light1', 'light2'],
                            // 6: ['control5', 'control6'],
                            12: ['gettingstarted4'],
                        }
                    }
                },
                groups: {
                        12: ['gettingstarted4']
                }
            },
        };

        const trainingCampEmojiButtons = {
            camp1: (typeof colorUtils.getEmojiButtons === 'function')
                ? colorUtils.getEmojiButtons([CAMP1_COMBINED_ID, 3, 6, 30, 12], {
                    [CAMP1_COMBINED_ID]: { label: 'Movement', bubbleLabel: 'Camp1 snippets', className: 'pink-circle' }
                })
                : [],
            camp2: (typeof colorUtils.getEmojiButtons === 'function')
                ? colorUtils.getEmojiButtons([CAMP2_COMBINED_ID, 3, 31, 12], {
                    [CAMP2_COMBINED_ID]: { label: 'Movement', bubbleLabel: 'Camp2 snippets', className: 'pink-circle' }
                })
                : [],
            camp3: (typeof colorUtils.getEmojiButtons === 'function')
                ? colorUtils.getEmojiButtons([CAMP3_COMBINED_ID, 2, 3, 32, 12], {
                    [CAMP3_COMBINED_ID]: { label: 'Motors', bubbleLabel: 'Camp3 snippets', className: 'blue-circle' }
                })
                : [],
            camp4: (typeof colorUtils.getEmojiButtons === 'function')
                ? colorUtils.getEmojiButtons([CAMP4_COMBINED_ID, 3, 6, 7, 33, 12], {
                    [CAMP4_COMBINED_ID]: { label: 'Movement', bubbleLabel: 'Camp4 snippets', className: 'pink-circle' }
                })
                : [],
        };

        let currentSnippetData = {};

        function renderEmojiButtons(buttons) {
            renderers.renderEmojiButtons({
                containerId: 'emoji-block',
                buttons,
                onClickFnName: 'refreshSnippets'
            });
        }

        function refreshSnippets(groupId) {
            const group = currentSnippetData[groupId];
            renderers.renderSnippetButtons({
                containerId: 'snippet-content',
                snippets: (typeof colorUtils.applySnippetTextColor === 'function')
                    ? colorUtils.applySnippetTextColor(group?.snippets || [])
                    : (group?.snippets || [])
            });
        }

        function getSnippetsForIds(groupId, snippetIds) {
            const sourceSnippets = snippetData[groupId]?.snippets || [];
            if (!Array.isArray(snippetIds) || snippetIds.length === 0) {
                return [...sourceSnippets];
            }

            const snippetById = new Map(sourceSnippets.map(snippet => [snippet.id, snippet]));
            return snippetIds
                .map(snippetId => snippetById.get(snippetId))
                .filter(Boolean);
        }

        function buildCombinedCampSnippets(combinedConfig) {
            return (combinedConfig.groups || []).flatMap(groupId =>
                getSnippetsForIds(groupId, combinedConfig.snippetIdsByGroup?.[groupId])
            );
        }

        function getCampLabel(campKey) {
            return trainingCampOptions.find(c => c.key === campKey)?.label || 'Lesson';
        }

        function renderTrainingCampMenu() {
            const menus = document.querySelectorAll('#training-camp-dropdown .menu-dropdown-menu, #lesson-launcher-menu');
            if (!menus.length) return;

            menus.forEach((menu) => {
                menu.textContent = '';
                trainingCampOptions.forEach(({ key, label }) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'dropdown-item';
                    button.textContent = label;
                    button.addEventListener('click', (event) => selectTrainingCamp(key, event));
                    menu.appendChild(button);
                });
            });
        }

        function updateLessonButtonLabel(campKey) {
            const lessonText = document.querySelector('.lesson-launcher-text');
            const lessonButton = document.querySelector('.lesson-launcher');
            const label = getCampLabel(campKey);

            if (lessonText) {
                lessonText.textContent = label;
            }

            if (lessonButton) {
                lessonButton.title = label;
                lessonButton.setAttribute('aria-label', label);
            }
        }

        function buildCampData(campKey) {
            currentSnippetData = {};
            const campConfig = trainingCampSnippetSelections[campKey] || {};
            const groupSelections = campConfig.groups || {};

            Object.keys(snippetData).forEach(k => {
                const numericKey = Number(k);
                currentSnippetData[k] = {
                    ...snippetData[k],
                    snippets: getSnippetsForIds(numericKey, groupSelections[numericKey])
                };
            });

            Object.entries(campConfig.combined || {}).forEach(([combinedId, combinedConfig]) => {
                currentSnippetData[combinedId] = {
                    colorClass: combinedConfig.colorClass,
                    snippets: buildCombinedCampSnippets(combinedConfig)
                };
            });
        }

        function selectTrainingCamp(campKey, event) {
            if (event) event.preventDefault();

            const buttons = trainingCampEmojiButtons[campKey];
            if (!buttons) return;

            buildCampData(campKey);
            renderEmojiButtons(buttons);
            refreshSnippets(buttons[0].id);
            updateLessonButtonLabel(campKey);
            closeTrainingCampDropdown();
            closeLessonLauncherMenu();
        }

        document.addEventListener('click', () => {
            closeTrainingCampDropdown();
            closeLessonLauncherMenu();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMobileMenu();
                closeTrainingCampDropdown();
                closeLessonLauncherMenu();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderTrainingCampMenu();
            selectTrainingCamp('camp1');
            if (typeof fetchGitHubRelease === 'function') fetchGitHubRelease();
        });
    </script>
    <script src="./utils/utils.js"></script>
