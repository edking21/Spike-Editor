<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spike</title>
    <style>
body {
    font-family: Arial, sans-serif;
    padding: 0px 2px 2px 2px;
    background-color: #ffffff;
    color: #000000;
    margin: 0;
}

.top-menu {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    background-color: #1a73e8;
    border-bottom: 1px solid #1a73e8;
    box-sizing: border-box;
    z-index: 1000;
    font-family: Arial, sans-serif;
    justify-content: flex-start;
    gap: 0;
}

.menu-search {
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 18px;
    line-height: 48px;
    height: 48px;
    width: 28px;
    cursor: pointer;
    padding: 0;
    margin-left: 14px;
    margin-right: 0;
}

.menu-toggle {
    display: none;
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 24px;
    line-height: 48px;
    height: 48px;
    width: 32px;
    cursor: pointer;
    padding: 0;
    margin-right: 10px;
}

.menu-brand {
    font-size: 16px;
    font-weight: 400;
    color: #ffffff;
    white-space: nowrap;
    line-height: 48px;
}

.menu-links {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 22px;
    height: 48px;
}

.menu-dropdown {
    position: relative;
    height: 48px;
    display: flex;
    align-items: center;
}

.menu-dropdown-toggle {
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
    height: 48px;
    line-height: 48px;
    padding: 0;
    cursor: pointer;
    border-bottom: 2px solid #ffffff;
    box-sizing: border-box;
}

.menu-dropdown-menu {
    display: none;
    position: absolute;
    top: 48px;
    left: 0;
    min-width: 300px;
    background: #ffffff;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    z-index: 1300;
    padding: 2px 0;
}

.menu-dropdown.open .menu-dropdown-menu {
    display: block;
}

.menu-dropdown-menu a,
.menu-dropdown-menu button,
.menu-dropdown-menu .dropdown-item {
    color: #222 !important;
    display: block;
    width: 100%;
    height: auto;
    line-height: 1.25;
    padding: 7px 10px;
    border: none;
    border-bottom: none;
    background: transparent;
    font-size: 13px;
    text-decoration: none;
    text-align: left;
    cursor: pointer;
    box-sizing: border-box;
}

.top-menu .menu-dropdown-menu a,
.top-menu .menu-dropdown-menu button,
.top-menu .menu-dropdown-menu .dropdown-item {
    height: auto;
    line-height: 1.25;
    border-bottom: none;
}

.menu-dropdown-menu a:hover,
.menu-dropdown-menu button:hover,
.menu-dropdown-menu .dropdown-item:hover {
    background: #f5f7fb;
}

.mobile-sidebar {
    display: none;
}

.mobile-overlay {
    display: none;
}

.top-menu a {
    color: #ffffff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    display: block;
    height: 48px;
    line-height: 48px;
    border-bottom: 2px solid transparent;
    box-sizing: border-box;
}

.top-menu a:visited {
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
}

.top-menu a:hover {
    color: #ffffff;
}

.top-menu a.active {
    color: #ffffff;
    border-bottom-color: #ffffff;
    font-size: 13px;
    font-weight: 500;
}

.top-menu a.active:visited {
    color: #ffffff;
}

.left-column {
    position: fixed;
    top: 0px;
    left: 0;
    width: 80px;
    height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    background-color: #f5f5f5;
    border-right: 1px solid #ccc;
    box-sizing: border-box;
}

.emoji-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding-top: 12px;
    height: 100%;
    overflow-y: auto;
    width: 100%;
}

.lesson-launcher {
    display: none;
}

.training-camp-snippet-column .lesson-launcher {
    --launcher-left: calc(80px + 12px);
    position: fixed;
    left: var(--launcher-left);
    right: 12px;
    bottom: max(0px, env(safe-area-inset-bottom));
    max-width: 460px;
    min-height: 38px;
    height: clamp(38px, 7vh, 56px);
    border: none;
    border-radius: 0;
    background: #f5f7fb;
    color: #222;
    padding: 0 12px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    cursor: pointer;
    box-shadow: none;
    border-top: 1px solid #dbe1ea;
    transition: background-color 0.14s ease;
    z-index: 1002;
}

.training-camp-snippet-column .lesson-launcher:hover {
    background: #edf2fb;
}

.lesson-launcher-menu {
    display: none;
    position: fixed;
    top: auto;
    left: calc(80px + 12px);
    right: 12px;
    bottom: calc(max(0px, env(safe-area-inset-bottom)) + clamp(38px, 7vh, 56px) + 2px);
    min-width: 260px;
    max-width: 420px;
    padding: 2px 0;
    height: 111px;
    overflow: hidden;
    z-index: 1301;
}

.lesson-launcher-menu.open {
    display: block;
}

@media (max-width: 900px) {
    .training-camp-snippet-column .lesson-launcher {
        --launcher-left: 12px;
        right: 12px;
    }

    .lesson-launcher-menu {
        left: 12px;
        right: 12px;
        min-width: 0;
        max-width: none;
    }
}

@media (max-height: 520px) {
    .training-camp-snippet-column .lesson-launcher {
        min-height: 34px;
        height: 34px;
        padding: 0 10px;
    }

    .lesson-launcher-menu {
        bottom: calc(max(0px, env(safe-area-inset-bottom)) + 36px + 2px);
    }
}

.lesson-launcher-icon {
    display: inline-block;
    min-width: 16px;
    text-align: center;
    font-size: 14px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: 0;
    white-space: nowrap;
    font-family: "Segoe UI Symbol", "Arial Unicode MS", Arial, sans-serif;
}

.lesson-launcher-text {
    font-size: 13px;
    line-height: 1.2;
    font-weight: 500;
    letter-spacing: 0.02em;
}

#snippet-content {
    padding-bottom: clamp(46px, 9vh, 72px);
}

.emoji-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.emoji-container button {
    font-size: 32px;
    cursor: pointer;
    border: none;
    background: none;
    transition: transform 0.15s ease, filter 0.15s ease;
}

.emoji-container button:hover {
    transform: scale(1.08);
    filter: brightness(110%);
}

.emoji-label {
    margin-top: 1px;
    font-size: 12px;
    color: black;
    text-align: center;
    width: 70px;
    word-wrap: break-word;
}

.snippet-column {
    margin-left: 80px;
    padding: 0px 12px 12px 12px;
}

.snippet {
    border: none;
    border-radius: 8px;
    padding: 6px;
    margin: 8px 0;
    background-color: transparent;
    width: 100%;
    box-sizing: border-box;
}

.snippet button {
    cursor: pointer;
    padding: 8px 12px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.12s ease, filter 0.12s ease;
}

.snippet button:hover {
    transform: scale(1.04);
    filter: brightness(110%);
}

.snippet .emoji {
    font-size: 1.3em;
    line-height: 1;
}

.snippet .label {
    font-size: 1em;
    white-space: pre-line;
}

.snippet-group-label {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #555;
    padding: 8px 8px 4px 8px;
    margin-top: 8px;
    border-top: 1px solid #e6e6e6;
    user-select: none;
}

.snippet-group-label:first-child {
    margin-top: 0;
    border-top: none;
}

.figure-modal-backdrop {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(15, 23, 42, 0.38);
    backdrop-filter: blur(2px);
    z-index: 2000;
}

.figure-panel {
    position: relative;
    width: min(680px, calc(100vw - 32px));
    max-width: 680px;
    background: #f7f9fc;
    border: 1px solid #dbe3ee;
    border-radius: 14px;
    box-sizing: border-box;
    padding: 20px 20px 18px 20px;
    box-shadow: 0 18px 42px rgba(15, 23, 42, 0.22);
}

.figure-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding-right: 36px;
}

.figure-header h2 {
    margin: 0;
    font-size: 20px;
    color: #1f2937;
}

.figure-year-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #1f2937;
}

.figure-year-picker select {
    border: 1px solid #cfd8e3;
    border-radius: 8px;
    background: #ffffff;
    color: #1f2937;
    font-size: 13px;
    padding: 8px 10px;
    min-width: 140px;
}

.figure-close {
    position: absolute;
    top: 12px;
    right: 12px;
    border: 1px solid #d6dce5;
    background: #ffffff;
    color: #374151;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
}

.figure-close:hover {
    background: #f3f4f6;
}

.figure-button-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
}

.figure-button {
    background: #1a73e8;
    color: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.figure-button:hover:not(:disabled) {
    opacity: 0.92;
    transform: translateY(-1px);
}

.figure-button:disabled {
    background: #b7c2d1;
    color: #eef3f8;
    cursor: not-allowed;
}

.figure-display-card {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    background: #ffffff;
    border: 1px solid #dfe7f3;
    border-radius: 10px;
    padding: 16px;
}

.figure-image-wrap {
    width: min(100%, 420px);
    min-height: 220px;
    background: linear-gradient(135deg, #f3f7ff, #edf5ff);
    border: 1px solid #d6e0f0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.figure-image-wrap img {
    display: none;
    max-width: 100%;
    max-height: 420px;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 8px;
}

.figure-meta {
    display: block;
    flex: 1;
    min-width: 0;
}

@media (max-width: 650px) {
    .figure-meta {
        display: none;
    }
}

.figure-caption {
    font-size: 16px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 8px;
}

.figure-note {
    font-size: 12px;
    color: #4b5563;
    line-height: 1.5;
}

.release-info {
    text-align: center;
    margin-top: 400px;
    padding: 20px;
    font-size: 12px;
    color: #666;
    border-top: 1px solid #eee;
}

.emoji-container .color-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
    font-size: 0;
}

.emoji-container .color-circle:hover {
    transform: scale(1.08);
    filter: brightness(110%);
}

.emoji-container .light-blue-circle   { background-color: #92b1e0 !important; }
.emoji-container .blue-circle         { background-color: #0066FF !important; }
.emoji-container .light-blue-circle   { background-color: #87CEEB !important; }
.emoji-container .red-circle          { background-color: #CC0000 !important; }
.emoji-container .pink-circle         { background-color: #FF69B4 !important; }
.emoji-container .purple-circle       { background-color: #8A2BE2 !important; }
.emoji-container .yellow-circle       { background-color: #FFD700 !important; }
.emoji-container .dark-yellow-circle  { background-color: #DAA520 !important; }
.emoji-container .green-circle        { background-color: #32CD32 !important; }
.emoji-container .orange-circle       { background-color: #FF8C00 !important; }
.emoji-container .dark-orange-circle  { background-color: #FF6600 !important; }
.emoji-container .light-purple-circle { background-color: #a564e1 !important; }

@media (max-width: 500px) {
    .menu-toggle {
        display: block;
    }

    .menu-links {
        display: none;
    }

    .menu-search {
        margin-left: auto;
    }

    .mobile-sidebar {
        display: block;
        position: fixed;
        top: 48px;
        left: 0;
        width: 230px;
        height: calc(100vh - 48px);
        background-color: #1a73e8;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        z-index: 1200;
        padding-top: 8px;
    }

    .mobile-sidebar a {
        display: block;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        padding: 12px 16px;
    }

    .mobile-sidebar a.active {
        background-color: rgba(255, 255, 255, 0.18);
    }

    .mobile-overlay {
        display: block;
        position: fixed;
        top: 48px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.35);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease;
        z-index: 1100;
    }

    body.mobile-menu-open .mobile-sidebar {
        transform: translateX(0);
    }

    body.mobile-menu-open .mobile-overlay {
        opacity: 1;
        visibility: visible;
    }

}
    </style>
</head>
<body>
    
    <div class="left-column">
        <div class="emoji-block" id="emoji-block">
            <!-- Dynamic emoji buttons go here -->
        </div>
    </div>
    <div class="snippet-column training-camp-snippet-column" id="snippet-column">
        <div id="snippet-content">
            <!-- Snippets will be dynamically inserted here -->
        </div>
        <button
            class="lesson-launcher"
            type="button"
            aria-label="Choose training lesson"
            aria-haspopup="true"
            aria-expanded="false"
            title="Choose lesson"
            onclick="toggleLessonLauncherMenu(event)">
            <span class="lesson-launcher-icon" aria-hidden="true">⋮</span>
            <span class="lesson-launcher-text">Lesson</span>
        </button>
        <div class="menu-dropdown-menu lesson-launcher-menu" id="lesson-launcher-menu">
            <!-- Populated from trainingCampOptions in script -->
        </div>
    </div>
    <div class="snippet-column">
        <div class="release-info" id="release-info">
            © 2026 Spike Editor - Loading release info...
        </div>
    </div>
    <script src="./utils/utils.js"></script>
<script src="./scripts/spike-shared.js"></script>
    <script>
        const shared = window.SpikeShared || {};
        const { renderers = {}, snippetData = {}, colorUtils = {} } =
            (typeof shared.bootstrapPage === 'function'
                ? shared.bootstrapPage({
                    dropdownId: 'training-camp-dropdown',
                    toggleDropdownFnName: 'toggleTrainingCampDropdown',
                    closeDropdownFnName: 'closeTrainingCampDropdown'
                })
                : shared);

        if ((typeof shared.bootstrapPage !== 'function') && (!shared.renderers || !shared.snippetData)) {
            console.error('SpikeShared not loaded correctly. Check ./scripts/spike-shared.js export.');
        }

        const baseToggleTrainingCampDropdown = window.toggleTrainingCampDropdown;
        const baseCloseTrainingCampDropdown = window.closeTrainingCampDropdown;

        function closeTrainingCampDropdown() {
            if (typeof baseCloseTrainingCampDropdown === 'function') {
                baseCloseTrainingCampDropdown();
            }
        }

        function closeLessonLauncherMenu() {
            const lessonMenu = document.getElementById('lesson-launcher-menu');
            const lessonButton = document.querySelector('.lesson-launcher');
            if (lessonMenu) lessonMenu.classList.remove('open');
            if (lessonButton) lessonButton.setAttribute('aria-expanded', 'false');
        }

        function toggleTrainingCampDropdown(event) {
            closeLessonLauncherMenu();
            if (typeof baseToggleTrainingCampDropdown === 'function') {
                baseToggleTrainingCampDropdown(event);
            }
        }

        function toggleLessonLauncherMenu(event) {
            if (event) event.stopPropagation();

            const lessonMenu = document.getElementById('lesson-launcher-menu');
            const lessonButton = document.querySelector('.lesson-launcher');
            if (!lessonMenu) return;

            const shouldOpen = !lessonMenu.classList.contains('open');
            closeTrainingCampDropdown();
            closeLessonLauncherMenu();

            if (shouldOpen) {
                lessonMenu.classList.add('open');
                if (lessonButton) lessonButton.setAttribute('aria-expanded', 'true');
            }
        }

        window.toggleTrainingCampDropdown = toggleTrainingCampDropdown;
        window.closeTrainingCampDropdown = closeTrainingCampDropdown;
        window.toggleLessonLauncherMenu = toggleLessonLauncherMenu;

        const CAMP1_COMBINED_ID = 1001;
        const CAMP2_COMBINED_ID = 2001;
        const CAMP3_COMBINED_ID = 3001;
        const CAMP4_COMBINED_ID = 4001;

        const trainingCampOptions = [
            { key: 'camp1', label: 'Training Camp Robot Shuffle' },
            { key: 'camp2', label: 'Training Camp Round the Garage' },
            { key: 'camp3', label: 'Training Camp Hay Bale' },
            { key: 'camp4', label: 'Training Camp Sensors' }
        ];

        const trainingCampSnippetSelections = {
            camp1: {
                combined: {
                    [CAMP1_COMBINED_ID]: {
                        colorClass: 'movement-color',
                        groups: [2, 3, 5, 6, 8, 12],
                        snippetIdsByGroup: {
                            2: ['move1', 'move2', 'move3', 'move5', 'move6', 'move7'],
                            3: ['light1', 'light2'],
                            5: ['event1', 'event5', 'event6'],
                            8: ['oper1'],
                            12: ['gettingstarted1'],
                        }
                    }
                },
                groups: {
                    5: ['event1', 'event5', 'event6'],
                    8: ['oper1'],
                    12: ['gettingstarted1']
                }
            },
            camp2: {
                combined: {
                    [CAMP2_COMBINED_ID]: {
                        colorClass: 'movement-color',
                        groups: [2, 3, 5, 6, 31, 12],
                        snippetIdsByGroup: {
                            2: ['move1', 'move2', 'move3', 'move5', 'move6', 'move7'],
                            3: ['light1', 'light2'],
                            5: ['event1', 'event6'],
                            6: ['control1', 'control2'],
                            31: ['challenge3', 'challenge4'],
                            12: ['gettingstarted5'],
                        }
                    }
                },
                groups: {
                    5: ['event1', 'event6'],
                    6: ['control1', 'control2'],
                    31: ['challenge3', 'challenge4'],
                    12: ['gettingstarted5']
                }
            },
            camp3: {
                combined: {
                    [CAMP3_COMBINED_ID]: {
                        colorClass: 'movement-color',
                        groups: [2, 3, 5, 6, 7, 8, 12],
                        snippetIdsByGroup: {
                            2: ['move1', 'move2', 'move3', 'move5', 'move6', 'move7'],
                            3: ['light1', 'light2'],
                            5: ['event1', 'event6'],
                            6: ['control1', 'control2'],
                            7: ['sensor1', 'sensor2'],
                            8: ['oper1', 'oper2','oper3'],
                            12: ['gettingstarted5'],
                        }
                    }
                },
                groups: {
                        12: ['gettingstarted5']
                }
            },
            camp4: {
                combined: {
                    [CAMP4_COMBINED_ID]: {
                        colorClass: 'movement-color',
                        groups: [21, 3, 5, 8, 12],
                        snippetIdsByGroup: {
                            21: ['move1', 'move2', 'move3', 'move5', 'move6', 'move7'],
                            3: ['light1', 'light2'],
                            5: ['event1', 'event6'],
                            8: ['oper1', 'oper2','oper3'],
                            12: ['gettingstarted5'],
                        }
                    }
                },
                groups: {
                        12: ['gettingstarted5']
                }
            },
        };

        const trainingCampEmojiButtons = {
            camp1: (typeof colorUtils.getEmojiButtons === 'function')
                ? colorUtils.getEmojiButtons([CAMP1_COMBINED_ID, 3, 5, 6, 30, 12], {
                    [CAMP1_COMBINED_ID]: { label: 'Movement', bubbleLabel: 'Camp1 snippets', className: 'pink-circle' }
                })
                : [],
            camp2: (typeof colorUtils.getEmojiButtons === 'function')
                ? colorUtils.getEmojiButtons([CAMP2_COMBINED_ID, 3, 5, 6, 31, 12], {
                    [CAMP2_COMBINED_ID]: { label: 'Movement', bubbleLabel: 'Camp2 snippets', className: 'pink-circle' }
                })
                : [],
            camp3: (typeof colorUtils.getEmojiButtons === 'function')
                ? colorUtils.getEmojiButtons([CAMP3_COMBINED_ID, 3, 5, 6, 32, 12], {
                    [CAMP3_COMBINED_ID]: { label: 'Movement', bubbleLabel: 'Camp3 snippets', className: 'pink-circle' }
                })
                : [],
            camp4: (typeof colorUtils.getEmojiButtons === 'function')
                ? colorUtils.getEmojiButtons([CAMP4_COMBINED_ID, 3, 5, 6, 7, 33, 12], {
                    [CAMP4_COMBINED_ID]: { label: 'Movement', bubbleLabel: 'Camp4 snippets', className: 'pink-circle' }
                })
                : [],
        };

        let currentSnippetData = {};

        function renderEmojiButtons(buttons) {
            renderers.renderEmojiButtons({
                containerId: 'emoji-block',
                buttons,
                onClickFnName: 'refreshSnippets'
            });
        }

        function refreshSnippets(groupId) {
            const group = currentSnippetData[groupId];
            renderers.renderSnippetButtons({
                containerId: 'snippet-content',
                snippets: (typeof colorUtils.applySnippetTextColor === 'function')
                    ? colorUtils.applySnippetTextColor(group?.snippets || [])
                    : (group?.snippets || [])
            });
        }

        function getSnippetsForIds(groupId, snippetIds) {
            const sourceSnippets = snippetData[groupId]?.snippets || [];
            if (!Array.isArray(snippetIds) || snippetIds.length === 0) {
                return [...sourceSnippets];
            }

            const snippetById = new Map(sourceSnippets.map(snippet => [snippet.id, snippet]));
            return snippetIds
                .map(snippetId => snippetById.get(snippetId))
                .filter(Boolean);
        }

        function buildCombinedCampSnippets(combinedConfig) {
            return (combinedConfig.groups || []).flatMap(groupId =>
                getSnippetsForIds(groupId, combinedConfig.snippetIdsByGroup?.[groupId])
            );
        }

        function getCampLabel(campKey) {
            return trainingCampOptions.find(c => c.key === campKey)?.label || 'Lesson';
        }

        function renderTrainingCampMenu() {
            const menus = document.querySelectorAll('#training-camp-dropdown .menu-dropdown-menu, #lesson-launcher-menu');
            if (!menus.length) return;

            menus.forEach((menu) => {
                menu.textContent = '';
                trainingCampOptions.forEach(({ key, label }) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'dropdown-item';
                    button.textContent = label;
                    button.addEventListener('click', (event) => selectTrainingCamp(key, event));
                    menu.appendChild(button);
                });
            });
        }

        function updateLessonButtonLabel(campKey) {
            const lessonText = document.querySelector('.lesson-launcher-text');
            const lessonButton = document.querySelector('.lesson-launcher');
            const label = getCampLabel(campKey);

            if (lessonText) {
                lessonText.textContent = label;
            }

            if (lessonButton) {
                lessonButton.title = label;
                lessonButton.setAttribute('aria-label', label);
            }
        }

        function buildCampData(campKey) {
            currentSnippetData = {};
            const campConfig = trainingCampSnippetSelections[campKey] || {};
            const groupSelections = campConfig.groups || {};

            Object.keys(snippetData).forEach(k => {
                const numericKey = Number(k);
                currentSnippetData[k] = {
                    ...snippetData[k],
                    snippets: getSnippetsForIds(numericKey, groupSelections[numericKey])
                };
            });

            Object.entries(campConfig.combined || {}).forEach(([combinedId, combinedConfig]) => {
                currentSnippetData[combinedId] = {
                    colorClass: combinedConfig.colorClass,
                    snippets: buildCombinedCampSnippets(combinedConfig)
                };
            });
        }

        function selectTrainingCamp(campKey, event) {
            if (event) event.preventDefault();

            const buttons = trainingCampEmojiButtons[campKey];
            if (!buttons) return;

            buildCampData(campKey);
            renderEmojiButtons(buttons);
            refreshSnippets(buttons[0].id);
            updateLessonButtonLabel(campKey);
            closeTrainingCampDropdown();
            closeLessonLauncherMenu();
        }

        document.addEventListener('click', () => {
            closeTrainingCampDropdown();
            closeLessonLauncherMenu();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMobileMenu();
                closeTrainingCampDropdown();
                closeLessonLauncherMenu();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderTrainingCampMenu();
            selectTrainingCamp('camp1');
            if (typeof fetchGitHubRelease === 'function') fetchGitHubRelease();
        });
    </script>
</body>
</html>
